# Fly.io deployment configuration for DeepAgent Service
# Deploy with: fly launch --config fly.toml

app = "deepagent-security"
primary_region = "nrt"  # Tokyo - change to your preferred region

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  HOST = "0.0.0.0"
  WORKERS = "2"
  MAX_ITERATIONS = "20"
  TIMEOUT_SECONDS = "300"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
