environment: dev

aws:
  account_id: "928974129003"
  region: us-east-1
  oidc_role_arn_secret: AWS_RELEASE_ROLE_ARN

deployment:
  target: ec2-ssh
  mode: single-node
  service_scope: all

release:
  require_manual_approval: false
  allow_rollback: true

health:
  # Backend URL 填完整 endpoint（deploy-aws 在配置了 *_url 时直接使用，不再拼接 path）
  backend_url: http://18.216.190.63:8080/health
  backend_path: /health
  # 单后端镜像场景：未部署前端容器时可不设；若 release 产出 frontend 镜像请补齐后再 deploy scope all
  frontend_url: TODO_IF_FRONTEND_DEPLOYED
  frontend_path: /
  timeout_seconds: 10
  retries: 6

ecr:
  # 仅推送后端镜像（仓库根 `python-agent-service/` Dockerfile）；前端无镜像则勿在 release 中选 frontend
  backend_repository: secmanus/test

ec2:
  ssh_user: ubuntu
  ssh_private_key_secret: AWS_EC2_SSH_PRIVATE_KEY
  container_runtime: docker
  single_node:
    host: 18.216.190.63
  ports:
    backend_host_port: 8080

runtime_secrets:
  env_source: github_environment_or_aws_secrets_manager
  names: []

logging:
  cloudwatch:
    enabled: true
    region: ""
    log_group: ""
    stream_prefix: ""
    retention_days: 30

# ECS / VPC：本环境使用 ec2-ssh，不使用 ECS/Fargate。
