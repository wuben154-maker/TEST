environment: dev

aws:
  account_id: "928974129003"
  # Primary AWS region for OIDC/ECR (images: 928974129003.dkr.ecr.us-east-2.amazonaws.com/secmanus/test).
  # App log shipping uses logging.cloudwatch.region (us-east-1) below.
  region: us-east-2
  oidc_role_arn_secret: AWS_RELEASE_ROLE_ARN

deployment:
  target: ec2-ssh
  mode: single-node
  service_scope: backend-only

release:
  require_manual_approval: false
  allow_rollback: true

health:
  backend_url: http://18.216.190.63:8000/health
  backend_path: /health
  frontend_url: TODO_NOT_USED_THIS_PHASE
  frontend_path: /
  timeout_seconds: 10
  retries: 12

ecr:
  backend_repository: secmanus/test

ec2:
  ssh_user: ubuntu
  ssh_private_key_secret: AWS_EC2_SSH_PRIVATE_KEY
  container_runtime: docker
  single_node:
    host: 18.216.190.63
  ports:
    backend_host_port: 8000

runtime_secrets:
  env_source: github_environment_or_aws_secrets_manager
  names: []

logging:
  cloudwatch:
    enabled: true
    region: us-east-1
    log_group: /ecs/TEST-dev
    stream_prefix: python-agent-service
    retention_days: 30
