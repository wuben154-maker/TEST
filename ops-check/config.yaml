project: TEST
environment: dev

cicdEnvironment: dev

testMapPath: ops-check/test-map.example.yaml

fixAgent:
  enabled: true
  simulateRunner: false
  timeoutMinutes: 30
  configPath: ops-check/fix-agent.yaml

logSources:
  - id: app-cloudwatch
    type: cloudwatch
    service: python-agent-service
    region: us-east-1
    logGroupNames:
      - /ecs/TEST-dev
    filterPattern: ""
    serviceField: service
    queryWindowMinutes: 30
    limit: 200

runtime:
  mode: github-actions
  pollIntervalMinutes: 10
  dryRun: false
  stateFile: .ops-check/state.json

classification:
  minOccurrencesForHigh: 1            # 降低阈值，让任何错误都能被分类为 high
  recoveryPollsToClose: 3
  recurrenceEscalation: true

autofix:
  enabled: true
  maxPrsPerRun: 1
  maxLlmCallsPerRun: 5                # 提高 LLM 预算
  maxIssueActionsPerRun: 20
  maxFeishuPerRun: 20
  maxGithubRetries: 2
  forbiddenPaths:
    - "**/.env*"
    - "**/secrets/**"
    - "**/migrations/**"
    - "**/auth/**"
    - "**/billing/**"
    - "**/iam/**"
  verificationCommands:
    - "echo skip-verification"

issues:
  labels:
    - ops-check
    - automated

notifications:
  feishuWebhookEnv: FEISHU_WEBHOOK_URL
  escalationWebhookEnv: FEISHU_ESCALATION_WEBHOOK_URL
  escalatePrAfterMinutes: 60

owners:
  default:
    reviewers:
      - name: wuben154-maker
        feishu_user_id: ""

defaults:
  logLimit: 200
  queryWindowMinutes: 30

routingAdvisor:
  enabled: true                       # 启用 LLM 路由
